<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulir Jasteb - ZLANEE STORE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-section">
    <a href="index.html" class="back-button">← Kembali ke Produk</a>
    <h2>Formulir Jasteb <span class="product-name"></span></h2>
    <form id="formJasteb">
      <input type="text" name="nama" placeholder="Nama Anda" required />
      <input type="text" name="wa" placeholder="Nomor WhatsApp" required />
      <input type="email" name="gmail" placeholder="Gmail (wajib untuk JASTEB)" required />
      <textarea name="catatan" placeholder="Catatan (opsional)"></textarea>
      <div class="file-upload">
        <label for="buktiPembayaran">Upload Bukti Pembayaran:</label>
        <input type="file" id="buktiPembayaran" name="buktiPembayaran" accept="image/*" required />
      </div>
      <button type="submit">Kirim Pesanan</button>
    </form>
  </div>

  <script src="script.js"></script>
  <script>
  // Set the current product from localStorage
  document.addEventListener('DOMContentLoaded', () => {
  const currentProduct = localStorage.getItem('currentProduct');
  if (currentProduct) {
    document.querySelector('h2').textContent = `Formulir untuk ${currentProduct}`;
  }

  document.getElementById('formJasteb')?.addEventListener('submit', function (e) {
    e.preventDefault();

    const fileInput = document.getElementById('buktiPembayaran');
    const file = fileInput?.files[0];

    if (!file) {
      alert('Silakan upload bukti pembayaran terlebih dahulu!');
      return;
    }

    const formData = new FormData(this);
    console.log("DEBUG >> File:", file);
    console.log("DEBUG >> Current Product:", currentProduct);
    console.log("DEBUG >> FormData:", [...formData.entries()]);

    sendToTelegram(formData, file, currentProduct);
  });
});

async function sendToTelegram(formData, file, currentProduct) {
  const BOT_TOKEN = '8458911661:AAFyXPOePwVmP8QjKkGEtD3J-Uitv6izOU';
  const CHAT_ID = '7681505131';

  const textMessage = `Pesanan Jasteb:
Produk: ${currentProduct}
Nama: ${formData.get('nama')}
WA: ${formData.get('wa')}
Gmail: ${formData.get('gmail')}
Catatan: ${formData.get('catatan') || '-'} `;

  try {
    // Kirim pesan teks
    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: textMessage,
        parse_mode: "Markdown"
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error("Telegram sendMessage Error: " + errText);
    }

    // Kirim foto bukti pembayaran
    const photoData = new FormData();
    photoData.append("chat_id", CHAT_ID);
    photoData.append("photo", file);

    const photoResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: photoData
    });

    if (!photoResponse.ok) {
      const errText = await photoResponse.text();
      throw new Error("Telegram sendPhoto Error: " + errText);
    }

    alert('✅ Pesanan berhasil dikirim ke Telegram!');
    localStorage.removeItem('currentProduct');
    window.location.href = "index.html";

  } catch (error) {
    console.error("DEBUG >> Error detail:", error);
    alert("❌ Error kirim ke Telegram: " + error.message);
  }
}
</script>
</body>
</html>
